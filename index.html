<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Rd | Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #090b14;
      background-image: 
        radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.2) 0px, transparent 40%),
        radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 40%);
      padding: 12px 14px;
      color: #ffffff;
    }

    .container {
      max-width: 390px;
      width: 100%;
      background: rgba(18, 22, 38, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 14px 16px 14px;
      text-align: center;
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .avatar-wrapper {
      width: 52px;
      height: 52px;
      position: relative;
      flex-shrink: 0;
    }
    .avatar-ring {
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
    }
    .main-avatar {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #151a30;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      border: 2px solid #090b14;
    }

    .user-info {
      text-align: left;
      flex: 1;
      margin-left: 12px;
    }
    .name-badge {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    h1 {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }
    .badge-icon {
      color: #38bdf8;
      font-size: 14px;
    }
    .role {
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 500;
      margin-top: 1px;
    }

    .more-btn {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* Compact Links */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .link-card {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .link-card:active {
      transform: scale(0.98);
    }

    .featured-ai {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.95), rgba(139, 92, 246, 0.92));
      color: #ffffff;
      box-shadow: 0 6px 18px -4px rgba(236, 72, 153, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .standard-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }

    .btn-logo-img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      margin-right: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .btn-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-right: 10px;
      flex-shrink: 0;
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }

    .btn-content {
      flex: 1;
      text-align: left;
    }
    .btn-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.15;
    }
    .btn-subtitle {
      font-size: 10.5px;
      opacity: 0.8;
    }

    .arrow-icon {
      font-size: 11px;
      opacity: 0.7;
    }
  </style>
</head>
<body onclick="playClickSound()">

  <div class="container">
    <div class="header-row">
      <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        <div class="main-avatar">A</div>
      </div>
      <div class="user-info">
        <div class="name-badge">
          <h1>Aayush Rd</h1>
          <i class="fa-solid fa-circle-check badge-icon"></i>
        </div>
        <div class="role">Software Developer • AI Prompt Hub</div>
      </div>
      <button class="more-btn"><i class="fa-solid fa-ellipsis"></i></button>
    </div>

    <div class="links-list">
      <a href="https://ayushdlpr.site" target="_blank" class="link-card featured-ai" onclick="playClickSound(event)">
        <img src="profile.jpg" alt="AI Logo" class="btn-logo-img">
        <div class="btn-content">
          <div class="btn-title">AI Image Prompt Generator</div>
          <div class="btn-subtitle">ayushdlpr.site • Tap to open</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </a>

      <a href="https://instagram.com/aro_ayush" target="_blank" class="link-card standard-card" onclick="playClickSound(event)">
        <div class="btn-icon-box">
          <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="btn-content">
          <div class="btn-title">Follow on Instagram</div>
          <div class="btn-subtitle">@aro_ayush</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </a>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound(e) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; max-width: 380px; width: 100%; border-radius: 20px; padding: 30px 24px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .avatar { width: 90px; height: 90px; border-radius: 50%; background: #38bdf8; margin: 0 auto 16px; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; color: #0f172a; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p.tagline { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .links a { display: block; background: #334155; color: #f8fafc; text-decoration: none; padding: 12px; margin-bottom: 12px; border-radius: 10px; font-weight: 500; transition: 0.2s; }
    .links a:hover { background: #38bdf8; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">K</div>
    <h1>Karan Rabidas</h1>
    <p class="tagline">Welcome to my official Bio page ✨</p>
    <div class="links">
      <a href="https://github.com/ayushrds922-sketch" target="_blank">GitHub Profile</a>
      <a href="#" target="_blank">Instagram</a>
      <a href="#" target="_blank">Contact Me</a>
    </div>
  </div>
</body>
</html>

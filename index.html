<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Rd | AI Prompt Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #060813;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.65;
      z-index: 0;
      animation: floatOrb 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 {
      width: 290px;
      height: 290px;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      top: -40px;
      left: -50px;
    }
    .orb-2 {
      width: 260px;
      height: 260px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      bottom: -30px;
      right: -40px;
      animation-duration: 10s;
      animation-delay: -3s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.15); }
    }

    .card-wrapper {
      position: relative;
      max-width: 400px;
      width: 100%;
      border-radius: 30px;
      padding: 2px;
      background: linear-gradient(60deg, #ff007f, #00f2fe, #9b51e0, #ff007f);
      background-size: 300% 300%;
      animation: borderFlow 5s ease infinite;
      box-shadow: 0 15px 40px -10px rgba(0, 242, 254, 0.35), 0 0 50px -15px rgba(255, 0, 127, 0.3);
      z-index: 1;
    }

    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(13, 17, 34, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 38px 24px 34px;
      text-align: center;
      position: relative;
    }

    .avatar-box {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
    }
    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe, #ff007f);
      animation: rotateRing 4s linear infinite;
      filter: drop-shadow(0 0 16px rgba(0, 242, 254, 0.8));
    }
    @keyframes rotateRing {
      100% { transform: rotate(360deg); }
    }
    .avatar-img {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .name-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .verified {
      color: #00f2fe;
      font-size: 20px;
      filter: drop-shadow(0 0 8px #00f2fe);
    }
    .username {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(90deg, #ff007f, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .bio-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 26px;
      font-size: 13.5px;
      line-height: 1.9;
      color: #cbd5e1;
    }
    .bio-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary-ai {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      color: #ffffff;
      background: linear-gradient(135deg, #ff007f, #7928ca, #00f2fe);
      background-size: 200% 200%;
      animation: pulseBtn 3s ease infinite;
      box-shadow: 0 10px 30px -5px rgba(255, 0, 127, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pulseBtn {
      0% { background-position: 0% 50%; box-shadow: 0 10px 30px -5px rgba(255, 0, 127, 0.6); }
      50% { background-position: 100% 50%; box-shadow: 0 15px 40px -3px rgba(0, 242, 254, 0.8); }
      100% { background-position: 0% 50%; box-shadow: 0 10px 30px -5px rgba(255, 0, 127, 0.6); }
    }

    .btn-primary-ai i.main-icon {
      font-size: 22px;
    }
    .btn-primary-ai span {
      flex: 1;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .btn-primary-ai i.arrow {
      font-size: 14px;
      opacity: 0.8;
    }

    .btn-primary-ai:active {
      transform: scale(0.96);
    }

    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
  </style>
</head>
<body onclick="playClickSound()">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card-wrapper">
    <div class="card">
      
      <div class="avatar-box">
        <div class="avatar-ring"></div>
        <img src="profile.jpg" alt="Profile Logo" class="avatar-img">
      </div>

      <div class="name-badge">
        <h1>Aayush Rd</h1>
        <i class="fa-solid fa-circle-check verified"></i>
      </div>
      <div class="username">AI IMAGE PROMPT HUB</div>

      <div class="bio-box">
        <div class="bio-item">🎨 <span>AI Image Prompt Generator</span></div>
        <div class="bio-item">✨ <span>Trending Viral Prompts</span></div>
        <div class="bio-item">🚀 <span>One-Click Prompt Copy</span></div>
      </div>

      <a href="https://ayushdlpr.site" target="_blank" class="btn-primary-ai" onclick="playClickSound(event)">
        <i class="fa-solid fa-wand-magic-sparkles main-icon"></i>
        <span>Generate AI Prompts</span>
        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
      </a>

      <div class="footer">
        ⚡ CRAFTED BY AAYUSH RD
      </div>

    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound(e) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(850, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }
  </script>
</body>
</html>

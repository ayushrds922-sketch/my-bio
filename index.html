<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Rd | Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090b14;
      background-image: 
        radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.22) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.15) 0px, transparent 60%);
      padding: 24px 16px;
      color: #ffffff;
    }

    .container {
      max-width: 410px;
      width: 100%;
      background: rgba(18, 22, 38, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 36px;
      padding: 34px 22px 28px;
      text-align: center;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* Top Action Dots */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .more-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
    }

    /* Top Profile Avatar */
    .avatar-wrapper {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      position: relative;
    }
    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
    }
    .main-avatar {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #151a30;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      color: #38bdf8;
      border: 2px solid #090b14;
    }

    /* Title & Bio */
    .name-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .badge-icon {
      color: #38bdf8;
      font-size: 17px;
    }
    .role {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .bio-text {
      color: #cbd5e1;
      font-size: 12.5px;
      line-height: 1.5;
      padding: 0 10px;
      margin-bottom: 22px;
    }

    /* Social Icon Row */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 26px;
    }
    .social-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .social-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.15);
    }

    /* Links Stack */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link-card {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 18px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .link-card:active {
      transform: scale(0.98);
    }

    /* Featured AI Prompt Card (Special Highlight with Photo Logo) */
    .featured-ai {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.95), rgba(139, 92, 246, 0.92));
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* Standard Card */
    .standard-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }
    .standard-card:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* Image Logo Inside Link Button */
    .btn-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      margin-right: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    /* Icon Box for other items */
    .btn-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .icon-cyan { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .icon-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

    /* Texts inside Button */
    .btn-content {
      flex: 1;
      text-align: left;
    }
    .btn-title {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .btn-subtitle {
      font-size: 11.5px;
      opacity: 0.8;
      font-weight: 500;
    }

    .arrow-icon {
      font-size: 13px;
      opacity: 0.7;
      margin-left: 10px;
    }

    /* Footer */
    .footer-text {
      margin-top: 26px;
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body onclick="playClickSound()">

  <div class="container">
    <div class="top-bar">
      <button class="more-btn" aria-label="options"><i class="fa-solid fa-ellipsis"></i></button>
    </div>

    <!-- Main Avatar -->
    <div class="avatar-wrapper">
      <div class="avatar-ring"></div>
      <div class="main-avatar">A</div>
    </div>

    <!-- User Details -->
    <div class="name-badge">
      <h1>Aayush Rd</h1>
      <i class="fa-solid fa-circle-check badge-icon"></i>
    </div>
    <div class="role">Software Developer</div>
    <p class="bio-text">
      Apps • Websites • Games<br>
      Explore my AI photo prompt generator & tools below.
    </p>

    <!-- Social Icon Shortcuts -->
    <div class="social-row">
      <a href="https://instagram.com/aro_ayush" target="_blank" class="social-btn" onclick="playClickSound(event)">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://github.com/ayushrds922-sketch" target="_blank" class="social-btn" onclick="playClickSound(event)">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://ayushdlpr.site" target="_blank" class="social-btn" onclick="playClickSound(event)">
        <i class="fa-solid fa-globe"></i>
      </a>
    </div>

    <!-- Links List -->
    <div class="links-list">

      <!-- MAIN FEATURED AI PROMPT WEBSITE WITH YOUR PHOTO LOGO -->
      <a href="https://ayushdlpr.site" target="_blank" class="link-card featured-ai" onclick="playClickSound(event)">
        <img src="profile.jpg" alt="AI Generator Logo" class="btn-logo-img">
        <div class="btn-content">
          <div class="btn-title">AI Image Prompt Generator</div>
          <div class="btn-subtitle">ayushdlpr.site • Tap to generate</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </a>

      <!-- Direct Instagram Link -->
      <a href="https://instagram.com/aro_ayush" target="_blank" class="link-card standard-card" onclick="playClickSound(event)">
        <div class="btn-icon-box icon-purple">
          <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="btn-content">
          <div class="btn-title">Follow on Instagram</div>
          <div class="btn-subtitle">@aro_ayush</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </a>

    </div>

    <div class="footer-text">
      Made with ❤️ by Aayush Rd<br>© 2026 All rights reserved
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound(e) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }
  </script>
</body>
</html>

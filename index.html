<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Rd | Services & Prompts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #090b14;
      background-image: 
        radial-gradient(at 50% 0%, rgba(236, 72, 153, 0.22) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.2) 0px, transparent 50%);
      padding: 16px 14px 40px;
      color: #ffffff;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(18, 22, 38, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 22px 18px 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.65);
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 16px;
    }

    .avatar-wrapper {
      width: 76px;
      height: 76px;
      position: relative;
      margin-bottom: 10px;
    }
    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
    }
    .main-avatar-img {
      position: absolute;
      inset: 2px;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #090b14;
      background: #13182c;
    }

    .name-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }
    .badge-icon {
      color: #38bdf8;
      font-size: 16px;
    }

    .role {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      margin-top: 3px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #64748b;
      margin-bottom: 10px;
      text-align: left;
      padding-left: 4px;
    }

    .services-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .service-card {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 16px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .service-card:active {
      transform: scale(0.98);
    }

    .featured-service {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.9), rgba(139, 92, 246, 0.9));
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(236, 72, 153, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .service-img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      margin-right: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    .standard-service {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }

    .service-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-right: 12px;
      flex-shrink: 0;
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }

    .service-details {
      flex: 1;
      text-align: left;
    }
    .service-name {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.2;
    }
    .service-desc {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .arrow-icon {
      font-size: 12px;
      opacity: 0.7;
      margin-left: 8px;
    }
  </style>
</head>
<body onclick="playClickSound()">

  <div class="container">
    <div class="profile-header">
      <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        <img src="logo.png" alt="Aayush Rd" class="main-avatar-img">
      </div>
      <div class="name-badge">
        <h1>Aayush Rd</h1>
        <i class="fa-solid fa-circle-check badge-icon"></i>
      </div>
      <div class="role">Software Developer</div>
    </div>

    <div class="section-title">Featured Services</div>

    <div class="services-list">
      <a href="https://ayushdlpr.site" target="_blank" class="service-card featured-service" onclick="playClickSound(event)">
        <img src="profile.jpg" alt="AI Generator" class="service-img">
        <div class="service-details">
          <div class="service-name">AI Image Prompt Generator</div>
          <div class="service-desc">ayushdlpr.site • Tap to generate</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </a>

      <a href="https://instagram.com/aro_ayush" target="_blank" class="service-card standard-service" onclick="playClickSound(event)">
        <div class="service-icon">
          <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="service-details">
          <div class="service-name">Follow on Instagram</div>
          <div class="service-desc">@aro_ayush</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </a>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound(e) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }
  </script>
</body>
</html>

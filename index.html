<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karan Rabidas | Bio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 390px;
      width: 100%;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    p.tagline {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .links a:hover, .links a:active {
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">K</div>
    <h1>Karan Rabidas</h1>
    <p class="tagline">Creative Developer & Designer ✨</p>
    <div class="links">
      <a href="https://github.com/ayushrds922-sketch" target="_blank">🌐 GitHub Profile</a>
      <a href="#" target="_blank">📸 Instagram</a>
      <a href="#" target="_blank">💬 Contact Me</a>
    </div>
  </div>
</body>
</html>
